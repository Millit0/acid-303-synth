<button id="btn-sqr" class="wave-btn" onclick="setWaveform('square')">SQR</button>
            </div>
        </div>

        <!-- شدت ضربه -->
        <div class="control-item">
            <span class="control-label">شدت کوبش (ACCENT)</span>
            <input type="range" id="accent-boost" min="1" max="2.5" step="0.1" value="1.5">
        </div>

        <!-- دکمه پلی -->
        <div class="control-item">
            <button id="play-btn" class="play-btn" onclick="togglePlay()">پخش (PLAY)</button>
        </div>
    </div>

    <!-- ردیف دوم: پیچ‌های فیلتر صدا -->
    <div class="panel-row">
        <div class="control-item">
            <span class="control-label">فرکانس فیلتر (CUTOFF)</span>
            <input type="range" id="cutoff" min="200" max="6000" value="1200" step="50">
        </div>
        <div class="control-item">
            <span class="control-label">تیزی اسیدی (RESONANCE)</span>
            <input type="range" id="resonance" min="1" max="25" value="14" step="0.5">
        </div>
        <div class="control-item">
            <span class="control-label">عمق فیلتر (ENV MOD)</span>
            <input type="range" id="env-mod" min="100" max="5000" value="2200" step="100">
        </div>
        <div class="control-item">
            <span class="control-label">کشش صدا (DECAY)</span>
            <input type="range" id="decay" min="0.1" max="0.9" value="0.3" step="0.05">
        </div>
    </div>

    <!-- بخش ۱۶ خانه ریتم -->
    <div>
        <div class="seq-header">
            <span>پنل ۱۶ خانه‌ای ریتم (PATTERN SEQUENCER)</span>
            <span class="seq-hint">برای روشن/خاموش کردن و ویرایش هر خانه روی آن کلیک کنید</span>
        </div>
        <div class="steps-grid" id="steps-container">
            <!-- خانه‌ها با جاوااسکریپت ساخته می‌شوند -->
        </div>
    </div>

    <!-- بخش تنظیم نت هر خانه -->
    <div class="edit-bar">
        <div>
            ویرایش خانه شماره: <strong id="selected-step-label" style="color: #00ff66; font-size: 16px;">1</strong>
        </div>
        <div>
            <label>انتخاب نت (NOTE): </label>
            <select id="step-note" onchange="updateSelectedStepNote(this.value)">
                <option value="C2">C2</option>
                <option value="C#2">C#2</option>
                <option value="D2">D2</option>
                <option value="D#2">D#2</option>
                <option value="E2" selected>E2</option>
                <option value="F2">F2</option>
                <option value="F#2">F#2</option>
                <option value="G2">G2</option>
                <option value="G#2">G#2</option>
                <option value="A2">A2</option>
                <option value="A#2">A#2</option>
                <option value="B2">B2</option>
                <option value="C3">C3</option>
            </select>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="step-slide" onchange="toggleSelectedStepAttr('slide')">
                سُر خوردن نت (SLIDE)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="step-accent" onchange="toggleSelectedStepAttr('accent')">
                ضربه قوی (ACCENT)
            </label>
        </div>
    </div>

</main>

<!-- فوتر و لینک دونیت ری‌میت -->
<footer>
    <div>ساخته شده با موتور صوتی Web Audio API</div>

</footer>

<!-- کدهای تولید صدا -->
<script>
    let audioCtx = null;
    let isPlaying = false;
    let currentStep = 0;
    let tempo = 126;
    let timerId = null;
    let waveformType = 'sawtooth';
    let currentSelectedStep = 0;

    const defaultNotes = ['E2', 'E2', 'G2', 'E2', 'A2', 'G2', 'E2', 'D2', 'E2', 'E2', 'B2', 'A2', 'G2', 'E2', 'D2', 'C2'];

    let pattern = Array(16).fill(0).map((_, i) => ({
        active: i % 2 === 0 || i === 3 || i === 11,
        note: defaultNotes[i],slide: i === 3 || i === 11,
        accent: i % 4 === 0
    }));

    const noteFrequencies = {
        'C2': 65.41, 'C#2': 69.30, 'D2': 73.42, 'D#2': 77.78,
        'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00,
        'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47, 'C3': 130.81
    };

    const stepsContainer = document.getElementById('steps-container');
    pattern.forEach((step, idx) => {
        const btn = document.createElement('button');
        btn.className = 'step-btn ' + (step.active ? 'active' : '');
        btn.id = 'step-btn-' + idx;
        btn.onclick = () => selectStep(idx);
        btn.innerHTML = `
            <span class="step-num">${idx + 1}</span>
            <span id="step-txt-￼{step.active ? step.note : '-'}</span>
            <span id="step-dot-${idx}" class="accent-dot ${step.accent ? 'on' : ''}"></span>
        `;
        stepsContainer.appendChild(btn);
    });

    function selectStep(idx) {
        currentSelectedStep = idx;
        document.getElementById('selected-step-label').innerText = idx + 1;
        document.getElementById('step-note').value = pattern[idx].note;
        document.getElementById('step-slide').checked = pattern[idx].slide;
        document.getElementById('step-accent').checked = pattern[idx].accent;
        
        pattern[idx].active = !pattern[idx].active;
        updateStepUI(idx);
    }

    function updateStepUI(idx) {
        const btn = document.getElementById('step-btn-' + idx);
        const txt = document.getElementById('step-txt-' + idx);
        const dot = document.getElementById('step-dot-' + idx);
        
        if (pattern[idx].active) {
            btn.classList.add('active');
            txt.innerText = pattern[idx].note;
        } else {
            btn.classList.remove('active');
            txt.innerText = '-';
        }

        if (pattern[idx].accent) {
            dot.classList.add('on');
        } else {
            dot.classList.remove('on');
        }
    }

    function updateSelectedStepNote(note) {
        pattern[currentSelectedStep].note = note;
        updateStepUI(currentSelectedStep);
    }

    function toggleSelectedStepAttr(attr) {
        pattern[currentSelectedStep][attr] = document.getElementById('step-' + attr).checked;
        updateStepUI(currentSelectedStep);
    }

    function changeTempo(amount) {
        tempo = Math.min(180, Math.max(60, tempo + amount));
        document.getElementById('tempo-display').innerText = tempo;
        if (isPlaying) {
            stopSequencer();
            startSequencer();
        }
    }

    function setWaveform(type) {
        waveformType = type;
        document.getElementById('btn-saw').className = 'wave-btn ' + (type === 'sawtooth' ? 'active' : '');
        document.getElementById('btn-sqr').className = 'wave-btn ' + (type === 'square' ? 'active' : '');
    }

    function togglePlay() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isPlaying = !isPlaying;
        const playBtn = document.getElementById('play-btn');
        if (isPlaying) {
            playBtn.innerText = 'توقف (STOP)';
            playBtn.classList.add('playing');
            startSequencer();
        } else {
            stopSequencer();
            playBtn.innerText = 'پخش (PLAY)';
            playBtn.classList.remove('playing');
        }
    }

    function startSequencer() {
        const interval = (60 / tempo / 4) * 1000;
        timerId = setInterval(() => {
            runStep();
            currentStep = (currentStep + 1) % 16;
        }, interval);
    }

    function stopSequencer() {
        clearInterval(timerId);
        currentStep = 0;
        for (let i = 0; i < 16; i++) {
            document.getElementById('step-btn-' + i).classList.remove('current-play');
        }
    }

    function runStep() {
        for (let i = 0; i < 16; i++) {
            const btn = document.getElementById('step-btn-' + i);
            if (i === currentStep) {
                btn.classList.add('current-play');
            } else {
                btn.classList.remove('current-play');
            }
        }

        const stepData = pattern[currentStep];
        if (stepData.active) {
            play303Note(stepData);
        }
    }

    let lastFreq = 82.41;

    function play303Note(step) {
        const now = audioCtx.currentTime;
        const freq = noteFrequencies[step.note] || 82.41;

        const osc = audioCtx.createOscillator();
        osc.type = waveformType;
        osc.frequency.setValueAtTime(lastFreq, now);
        
        if (step.slide) {
            osc.frequency.exponentialRampToValueAtTime(freq, now + 0.08);
        } else {
            osc.frequency.setValueAtTime(freq, now);
        }
        lastFreq = freq;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        
        const cutoffVal = parseFloat(document.getElementById('cutoff').value);
        const resVal = parseFloat(document.getElementById('resonance').value);
        const envModVal = parseFloat(document.getElementById('env-mod').value);
        const decayVal = parseFloat(document.getElementById('decay').value);
        const accentMultiplier = step.accent ? parseFloat(document.getElementById('accent-boost').value) : 1.0;

        filter.Q.setValueAtTime(resVal, now);
        filter.frequency.setValueAtTime(cutoffVal, now);

        const peakFilter = Math.min(14000, Math.max(100, cutoffVal + (envModVal * accentMultiplier)));
        filter.frequency.exponentialRampToValueAtTime(peakFilter, now + 0.015);
        filter.frequency.exponentialRampToValueAtTime(cutoffVal, now + decayVal);

        const gainNode = audioCtx.createGain();
        const peakGain = step.accent ? 0.65 : 0.35;
        gainNode.gain.setValueAtTime(peakGain, now);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + decayVal);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + decayVal + 0.05);
    }
</script>
